<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomDekho - Zero Brokerage Rooms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">🏠 RoomDekho</h1>
      <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
        + Apna Room List Karein
      </button>
    </div>
  </header>

  <!-- Add Room Form -->
  <section id="formSection" class="hidden max-w-2xl mx-auto px-4 py-6">
    <div class="bg-white p-6 rounded-xl shadow-lg border border-indigo-100">
      <h3 class="text-xl font-bold text-gray-800 mb-4">Naya Room Cloud Database Me Add Karein</h3>
      <form id="roomForm" onsubmit="addNewRoom(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Room Title</label>
          <input type="text" id="title" required placeholder="e.g. Single Room near Station" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Location / Area</label>
            <input type="text" id="location" required placeholder="e.g. Kankarbagh, Boring Road" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Monthly Rent (₹)</label>
            <input type="number" id="rent" required placeholder="e.g. 3500" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Tenant Type</label>
            <select id="type" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
              <option value="Boys">Boys</option>
              <option value="Girls">Girls</option>
              <option value="Family">Family</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp Number</label>
            <input type="text" id="phone" required placeholder="e.g. 919876543210" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Room Image URL</label>
          <input type="url" id="image" required placeholder="Paste image link here" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Suvidhayein (Comma se alag karein)</label>
          <input type="text" id="amenities" placeholder="e.g. Wi-Fi, RO Water, Bed" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
        </div>

        <div class="flex gap-2">
          <button id="submitBtn" type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition">
            Save & Publish Room
          </button>
          <button type="button" onclick="toggleForm()" class="bg-gray-200 text-gray-700 font-semibold px-4 py-2.5 rounded-lg hover:bg-gray-300">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- Hero Section & Filters -->
  <section class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-3xl font-extrabold text-center mb-2">Apne Budget Me Room Dhundhein</h2>
    <p class="text-center text-gray-500 mb-6">Bina broker aur bina commission ke direct owner se baat karein</p>

    <!-- Search & Filter Bar -->
    <div class="bg-white p-4 rounded-xl shadow-md space-y-3">
      <div>
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="🔍 Area ya location likh kar search karein (e.g. Boring Road, Station)..." class="w-full border p-2.5 rounded-lg bg-gray-50 focus:outline-indigo-500">
      </div>

      <div class="flex flex-wrap gap-4 items-center justify-between">
        <div class="flex-1 min-w-[150px]">
          <label class="block text-xs font-semibold text-gray-500 mb-1">Kis ke liye chahiye?</label>
          <select id="typeFilter" onchange="applyFilters()" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
            <option value="All">Sabhi (All)</option>
            <option value="Boys">Boys</option>
            <option value="Girls">Girls</option>
            <option value="Family">Family</option>
          </select>
        </div>

        <div class="flex-1 min-w-[150px]">
          <label class="block text-xs font-semibold text-gray-500 mb-1">Max Budget (₹/month)</label>
          <select id="budgetFilter" onchange="applyFilters()" class="w-full border p-2 rounded-lg bg-gray-50 focus:outline-indigo-500">
            <option value="100000">No Limit</option>
            <option value="10000">Upto ₹10,000</option>
            <option value="5000">Upto ₹5,000</option>
            <option value="3500">Upto ₹3,500</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- Room Cards Grid -->
  <main class="max-w-6xl mx-auto px-4 pb-12">
    <div id="roomContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <p class="col-span-full text-center text-gray-500 py-8">SQL Database se rooms load ho rahe hain...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
